<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Provivir — Plataforma de agendamiento inteligente · CDC Oriente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F7; --card:#FFFFFF; --ink:#13272F; --muted:#5C7078; --line:#E1E8EA;
  --teal:#0E6E6B; --teal-ink:#0A4E4C; --teal-soft:#E2F1F0;
  --green:#2F9E62; --green-soft:#E4F4EB;
  --amber:#C77E1E; --amber-soft:#FBF0DC;
  --blue:#2E6FD8; --blue-soft:#E7EFFC;
  --red:#C34A38;  --red-soft:#FAE8E4;
  --slate:#1D3540;
  --shadow:0 1px 2px rgba(19,39,47,.06),0 4px 14px rgba(19,39,47,.06);
  --r:12px;
  --fd:'Sora',system-ui,sans-serif;
  --fb:'IBM Plex Sans',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--ink)}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ====== Chip de código de atención ====== */
.code-chip{font-family:var(--fm);font-weight:600;letter-spacing:.12em;background:var(--slate);color:#EAF4F2;
  padding:.18rem .55rem;border-radius:7px;font-size:.85rem;display:inline-block;white-space:nowrap}
.code-chip.lg{font-size:1.4rem;padding:.35rem .9rem;border-radius:10px}
.code-chip.ghost{background:var(--teal-soft);color:var(--teal-ink)}

/* ====== Etiquetas ====== */
.tag{display:inline-block;padding:.14rem .55rem;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.t-teal{background:var(--teal-soft);color:var(--teal-ink)}
.t-green{background:var(--green-soft);color:#1E6B42}
.t-amber{background:var(--amber-soft);color:#8A5510}
.t-blue{background:var(--blue-soft);color:#1D4FA3}
.t-red{background:var(--red-soft);color:#93321F}
.t-gray{background:#EDF1F2;color:var(--muted)}

/* ====== Login ====== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0C3B3A 0%,#0E6E6B 55%,#12827E 100%)}
.login-card{background:var(--card);border-radius:18px;padding:2.4rem 2.2rem;width:min(430px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.28)}
.brand{display:flex;align-items:center;gap:.7rem;margin-bottom:.4rem}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-weight:700;font-size:1.05rem;letter-spacing:.05em}
.brand h1{font-size:1.35rem}
.login-sub{color:var(--muted);font-size:.86rem;margin-bottom:1.5rem}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:9px;background:#FBFCFC}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1.1rem;border-radius:9px;font-weight:600;font-size:.9rem;transition:filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn-primary{background:var(--teal);color:#fff}
.btn-dark{background:var(--slate);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-soft{background:var(--teal-soft);color:var(--teal-ink)}
.btn-danger{background:var(--red-soft);color:#93321F}
.btn-green{background:var(--green);color:#fff}
.btn-amber{background:var(--amber-soft);color:#8A5510}
.btn-block{width:100%}
.btn-sm{padding:.35rem .7rem;font-size:.8rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.quick-roles{margin-top:1.4rem;border-top:1px solid var(--line);padding-top:1.1rem}
.quick-roles p{font-size:.78rem;color:var(--muted);margin-bottom:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.quick-roles .grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}

/* ====== Shell ====== */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--slate);color:#C6D6DA;padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.15rem}
aside .brand{color:#fff;padding:.2rem .5rem .9rem;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:.7rem}
aside .brand h1{font-size:1.02rem}
aside .brand .brand-mark{width:34px;height:34px;font-size:.85rem}
.nav-sec{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#7E959C;padding:.8rem .55rem .3rem;font-weight:600}
.nav-item{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.5rem .55rem;border-radius:8px;font-size:.88rem;color:#C6D6DA}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:var(--teal);color:#fff;font-weight:600}
.nav-item .ic{width:1.15rem;text-align:center;opacity:.9}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:.66rem;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 .32rem;font-weight:700}
aside .foot{margin-top:auto;padding-top:.8rem;border-top:1px solid rgba(255,255,255,.12)}
main{padding:1.4rem 1.8rem 3rem;max-width:1340px;width:100%}
.topbar{display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap}
.topbar h2{font-size:1.35rem}
.topbar .sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.topbar .spacer{flex:1}
.user-pill{display:flex;align-items:center;gap:.55rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.32rem .8rem .32rem .4rem;box-shadow:var(--shadow)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.user-pill .nm{font-size:.83rem;font-weight:600}
.user-pill .rl{font-size:.7rem;color:var(--muted)}
.fecha-pill{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem .8rem;box-shadow:var(--shadow);font-size:.85rem;font-weight:600}
.fecha-pill select{border:none;background:none;font-weight:600;font-size:.85rem}

/* ====== Cards / grid ====== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:center;gap:.7rem;padding:.95rem 1.15rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .hd h3{font-size:.98rem}
.card .hd .spacer{flex:1}
.card .bd{padding:1.05rem 1.15rem}
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:860px){.shell{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;position:sticky;top:0;z-index:30}aside .foot{margin-top:0}main{padding:1rem}}

.kpi{padding:1rem 1.1rem}
.kpi .lb{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi .vl{font-family:var(--fd);font-size:1.75rem;font-weight:700;margin-top:.25rem}
.kpi .dt{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.kpi.accent{border-top:3px solid var(--teal)}

/* ====== Tablas ====== */
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--line);font-weight:600}
td{padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clickable:hover{background:#F7FAFA;cursor:pointer}
.right{text-align:right}.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:.8rem}
.name-doc b{display:block}.name-doc span{font-size:.76rem;color:var(--muted)}
.link-name{cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.link-name:hover{color:var(--teal-ink)}

/* ====== Buscadores / tabs ====== */
.searchbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.searchbar input,.searchbar select{padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:200px}
.tabs{display:inline-flex;gap:.25rem;background:#EDF1F2;border-radius:9px;padding:.22rem}
.tabs button{padding:.35rem .85rem;border-radius:7px;font-size:.82rem;font-weight:600;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* ====== WhatsApp simulator ====== */
.wa-wrap{display:grid;grid-template-columns:250px 1fr 280px;gap:1rem;align-items:start}
@media(max-width:1080px){.wa-wrap{grid-template-columns:1fr}}
.wa-conv{padding:.7rem .85rem;border-bottom:1px solid var(--line);cursor:pointer}
.wa-conv:hover{background:#F7FAFA}
.wa-conv.active{background:var(--teal-soft)}
.wa-conv .ph{font-family:var(--fm);font-size:.78rem;color:var(--muted)}
.wa-chat{background:#E8E2D8;border-radius:var(--r);border:1px solid var(--line);display:flex;flex-direction:column;height:560px;overflow:hidden}
.wa-head{background:var(--teal);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem}
.wa-head .ph{font-family:var(--fm);font-size:.78rem;opacity:.85}
.wa-body{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.msg{max-width:78%;padding:.55rem .8rem;border-radius:12px;font-size:.88rem;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg.p{align-self:flex-end;background:#D3F1DC;border-bottom-right-radius:3px}
.msg.ia{align-self:flex-start;background:#fff;border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:#FBF0DC;font-size:.76rem;color:#8A5510;border-radius:8px}
.msg .who{font-size:.68rem;font-weight:700;color:var(--teal-ink);margin-bottom:.15rem;text-transform:uppercase;letter-spacing:.05em}
.wa-ticket{font-family:var(--fm);font-size:.78rem;background:#F7FBFA;border:1px dashed #B9C6CA;border-radius:8px;padding:.6rem .7rem;margin-top:.4rem;white-space:pre-line;line-height:1.5}
.wa-audio{display:flex;align-items:center;gap:.5rem;background:#EAF2EC;border-radius:99px;padding:.4rem .8rem;font-size:.8rem;margin-bottom:.3rem}
.wa-input{display:flex;gap:.5rem;padding:.7rem;background:#F2EFE9;border-top:1px solid var(--line)}
.wa-input input{flex:1;padding:.6rem .8rem;border-radius:999px;border:1px solid var(--line)}
.ia-panel .row{display:flex;justify-content:space-between;gap:.6rem;padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.ia-panel .row:last-child{border-bottom:none}
.conf-bar{height:7px;border-radius:99px;background:#EDF1F2;overflow:hidden;margin-top:.3rem}
.conf-bar i{display:block;height:100%;background:var(--teal)}

/* ====== Kiosko / Portal público ====== */
.fullscreen{position:fixed;inset:0;z-index:100;overflow:auto}
.kiosk{background:linear-gradient(165deg,#0C3B3A,#0E6E6B);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;color:#fff;text-align:center;position:relative}
.kiosk .panel{background:#fff;color:var(--ink);border-radius:22px;padding:2.4rem 2.2rem;width:min(600px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.kiosk h1{font-size:1.6rem;margin-bottom:.4rem}
.kiosk .panel p.sub{color:var(--muted);margin-bottom:1.4rem}
.kiosk .big-btn{width:100%;padding:1.1rem;font-size:1.15rem;border-radius:14px;font-weight:700}
.kiosk input.code-in{width:100%;padding:1rem;font-size:1.6rem;text-align:center;font-family:var(--fm);letter-spacing:.25em;border:2px solid var(--line);border-radius:14px;text-transform:uppercase;margin:.4rem 0 1rem}
.kiosk .exit{position:fixed;top:1rem;right:1rem;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:.4rem .8rem;font-size:.8rem;z-index:5}
.kiosk .kmsg{border-radius:14px;padding:1.1rem;margin-bottom:1.2rem;font-size:1rem;line-height:1.5}
.kiosk .kmsg.ok{background:var(--green-soft);color:#1E6B42}
.kiosk .kmsg.warn{background:var(--amber-soft);color:#8A5510}
.kiosk .kmsg.err{background:var(--red-soft);color:#93321F}
.k-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.4rem}
.k-grid .btn{min-height:88px;flex-direction:column;gap:.35rem;font-size:1rem;border-radius:14px;font-weight:700}
.k-grid .btn .kic{font-size:1.6rem}
.ribbon{position:fixed;top:0;left:0;right:0;background:var(--amber);color:#fff;font-weight:700;font-size:.85rem;text-align:center;padding:.45rem;letter-spacing:.04em;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.qr-box{width:150px;height:150px;margin:.8rem auto;border-radius:12px;border:2px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:2px;padding:8px;background:#fff}
.qr-box i{background:var(--slate);border-radius:1px}
.qr-box i.w{background:#fff}

/* ====== Pantalla de sala (TV) ====== */
.tv{background:#0B1E24;min-height:100vh;color:#fff;display:flex;flex-direction:column;font-family:var(--fd)}
.tv-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2.4rem;background:#0E2B33;border-bottom:2px solid rgba(255,255,255,.08)}
.tv-head .t{font-size:1.4rem;font-weight:700}
.tv-head .clock{font-family:var(--fm);font-size:1.4rem;color:#8FD8D2}
.tv-main{flex:1;display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:auto 1fr;gap:1.6rem;padding:1.8rem 2.4rem;align-items:stretch}
@media(max-width:900px){.tv-main{grid-template-columns:1fr;grid-template-rows:auto}}
.tv-now{background:linear-gradient(160deg,#0E6E6B,#12827E);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.2rem;text-align:center;position:relative;overflow:hidden}
.tv-now .lb{font-size:1rem;letter-spacing:.25em;text-transform:uppercase;color:#BFE8E4;font-weight:600}
.tv-now .code{font-family:var(--fm);font-size:clamp(3.4rem,9vw,6.5rem);font-weight:700;letter-spacing:.1em;line-height:1.05;margin:.5rem 0}
.tv-now .dest{font-size:clamp(1.3rem,3vw,2.1rem);font-weight:700}
.tv-now .svc{font-size:1.05rem;color:#CFEDEA;margin-top:.4rem}
.tv-now.flash{animation:tvflash 1s ease 3}
@keyframes tvflash{0%,100%{box-shadow:0 0 0 0 rgba(143,216,210,0)}50%{box-shadow:0 0 0 14px rgba(143,216,210,.45)}}
.tv-bell{position:absolute;top:1.2rem;right:1.4rem;font-size:1.6rem;opacity:0}
.tv-bell.on{opacity:1;animation:ring .5s ease 4}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.tv-list{display:flex;flex-direction:column;gap:.8rem;grid-row:span 2}
.tv-list h2{font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:#7FA6AD;font-weight:600}
.tv-row{display:flex;align-items:center;justify-content:space-between;background:#10333C;border-radius:14px;padding:.9rem 1.3rem}
.tv-row .code{font-family:var(--fm);font-size:1.7rem;font-weight:700;letter-spacing:.1em}
.tv-row .dest{font-size:1.1rem;font-weight:600;text-align:right}
.tv-row .svc{font-size:.82rem;color:#7FA6AD;text-align:right}
.tv-media{background:#10333C;border-radius:18px;padding:1rem 1.3rem;display:flex;flex-direction:column;gap:.6rem;min-height:190px}
.tv-media .mlabel{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#7FA6AD;font-weight:600;display:flex;justify-content:space-between;align-items:center;font-family:var(--fb)}
.tv-media .mframe{flex:1;border-radius:12px;background:linear-gradient(135deg,#14424D,#0E2B33);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;font-family:var(--fb);border:1px solid rgba(255,255,255,.08)}
.tv-media .mframe .mt{font-size:1.15rem;font-weight:700}
.tv-media .mframe .ms{font-size:.8rem;color:#8FB4BB}
.tv-ticker{background:#0E2B33;padding:.85rem 2.4rem;font-size:1rem;color:#BFE8E4;border-top:2px solid rgba(255,255,255,.08);font-family:var(--fb)}
.tv .exit{position:fixed;top:1rem;right:1rem;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:.4rem .8rem;font-size:.8rem;z-index:5;font-family:var(--fb)}

/* ====== Vista prestador ====== */
.pv-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.pv-actions .btn{padding:.85rem 1.3rem;font-size:1rem;border-radius:12px}
.pv-current{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.pv-current .code-chip{font-size:2rem;padding:.5rem 1.1rem}
.q-row.prio1{box-shadow:inset 3px 0 0 var(--amber)}
.wait{font-family:var(--fm);font-size:.8rem}

@media(max-width:700px){
  .topbar{margin-bottom:1rem}
  .topbar h2{font-size:1.12rem}
  .topbar .sub{font-size:.78rem}
  .user-pill .rl{display:none}
  table.t-cards thead{display:none}
  table.t-cards,table.t-cards tbody,table.t-cards tr,table.t-cards td{display:block;width:100%}
  table.t-cards tr{border:1px solid var(--line);border-radius:12px;margin:.65rem .8rem;padding:.4rem .15rem;background:#fff;box-shadow:var(--shadow);width:auto}
  table.t-cards tr.prio1{border-left:4px solid #D98E1B;box-shadow:var(--shadow)}
  table.t-cards td{border-bottom:none;padding:.34rem .85rem;display:flex;justify-content:space-between;align-items:center;gap:.9rem;font-size:.93rem}
  table.t-cards td[data-l]::before{content:attr(data-l);font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
  table.t-cards td.t-act{justify-content:stretch}
  table.t-cards td.t-act .btn{width:100%;min-height:48px}
  table.t-cards .empty{border:none;box-shadow:none}
  .pv-actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .pv-actions .btn{min-height:54px;font-size:.98rem;padding:.6rem .5rem}
  .pv-actions .btn:first-child{grid-column:1/-1;min-height:64px;font-size:1.12rem}
  .pv-current{justify-content:center;text-align:center;flex-direction:column;gap:.6rem}
  .pv-current .code-chip{font-size:2.6rem;padding:.55rem 1.2rem}
  .pv-grid>div:first-child{order:2}
}
@media(max-width:860px){
  body[data-role="prestador"] aside{position:fixed;top:auto;bottom:0;left:0;right:0;flex-direction:row;flex-wrap:nowrap;justify-content:space-around;align-items:stretch;gap:.2rem;padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,40,46,.25);z-index:60}
  body[data-role="prestador"] aside .brand,body[data-role="prestador"] aside .nav-sec{display:none}
  body[data-role="prestador"] aside .foot{margin:0;padding:0;border:none;display:flex}
  body[data-role="prestador"] .nav-item{flex-direction:column;gap:.18rem;font-size:.64rem;padding:.45rem .4rem;align-items:center;justify-content:center;flex:1;text-align:center;border-radius:10px}
  body[data-role="prestador"] .nav-item .ic{font-size:1.3rem;width:auto}
  body[data-role="prestador"] main{padding:.9rem .9rem 6.8rem}
}

/* ====== Ticket / modal ====== */
.modal-mask{position:fixed;inset:0;background:rgba(13,30,36,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:#fff;border-radius:16px;max-width:660px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal .hd{display:flex;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.modal .hd h3{font-size:1.02rem}
.modal .bd{padding:1.2rem}

.ticket .c{text-align:center}
.ticket .clin{font-weight:700;letter-spacing:.08em;font-size:.9rem}
.ticket hr{border:none;border-top:1px dashed #B9C6CA;margin:.7rem 0}
.ticket .code{font-size:2.1rem;font-weight:700;letter-spacing:.14em;text-align:center;margin:.5rem 0}
.ticket .kv{display:flex;justify-content:space-between;margin:.25rem 0}
@media print{body *{visibility:hidden}.print-zone,.print-zone *{visibility:visible}.print-zone{position:absolute;left:0;top:0;width:100%}}

/* ====== Agenda consolidada ====== */
.sched{display:grid;grid-template-columns:70px repeat(var(--cols),1fr);gap:2px;font-size:.8rem}
.sched .hcell{background:#F0F4F5;padding:.5rem;font-weight:600;text-align:center;border-radius:6px}
.sched .tcell{color:var(--muted);font-family:var(--fm);font-size:.72rem;padding:.4rem .3rem;text-align:right}
.slot{border-radius:6px;padding:.35rem .45rem;min-height:42px;background:#F7FAFA;border:1px dashed var(--line)}
.slot.busy{background:var(--teal-soft);border:1px solid #BCE0DE;cursor:pointer}
.slot.busy.ctrl{background:var(--amber-soft);border-color:#EAD2A6}
.slot.busy.proc{background:var(--blue-soft);border-color:#BFD3F3}
.slot.busy .cd{font-family:var(--fm);font-weight:700;font-size:.72rem}
.slot.blocked{background:#EDF1F2;border:1px solid var(--line);color:var(--muted);text-align:center}
.slot.free:hover{border-color:var(--teal);cursor:pointer}
/* Mes */
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mes .dh{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:center;padding:.3rem 0}
.mes .d{border:1px solid var(--line);border-radius:9px;min-height:64px;padding:.35rem .45rem;font-size:.75rem;background:#fff;cursor:pointer;position:relative}
.mes .d:hover{border-color:var(--teal)}
.mes .d .dn{font-weight:700;font-family:var(--fm);font-size:.72rem}
.mes .d .cnt{margin-top:.25rem;font-size:.68rem;color:var(--teal-ink);background:var(--teal-soft);border-radius:6px;padding:.08rem .3rem;display:inline-block}
.mes .d.off{background:#F5F8F8;color:#B4C2C6;cursor:default}
.mes .d.sel{border-color:var(--teal);background:var(--teal-soft)}

/* ====== Barras ====== */
.bar-row{display:grid;grid-template-columns:140px 1fr 46px;gap:.7rem;align-items:center;margin:.45rem 0;font-size:.84rem}
.bar-track{height:12px;border-radius:99px;background:#EDF1F2;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar-track i.alt{background:var(--blue)}
.bar-track i.warn{background:var(--amber)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:.6rem}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.3rem}

/* ====== Misc ====== */
.toast-wrap{position:fixed;bottom:1.2rem;right:1.2rem;display:flex;flex-direction:column;gap:.5rem;z-index:300}
.toast{background:var(--slate);color:#fff;padding:.7rem 1rem;border-radius:10px;font-size:.86rem;box-shadow:var(--shadow);animation:tin .25s ease;max-width:360px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:2rem;text-align:center;color:var(--muted);font-size:.88rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:2.2rem;text-align:center;color:var(--muted);background:#FBFCFC}
.switch{position:relative;width:38px;height:21px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#CBD7DA;border-radius:99px;transition:.15s}
.switch .sl:before{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .sl{background:var(--teal)}
.switch input:checked + .sl:before{transform:translateX(17px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function nuevoCodigo(letra){
  let n=147;
  while(CITAS.some(c=>c.cod===letra+String(n).padStart(4,'0') && c.sede===S.sede)) n++;
  return letra+String(n).padStart(4,'0');
}
function estadoTag(e){
  const map={'Confirmada':'t-teal','Llegó':'t-green','En espera':'t-blue','Llamado':'t-amber','En atención':'t-blue','Atendida':'t-green','Atendido':'t-green','Pendiente llegada':'t-gray','No asistió':'t-red','No respondió':'t-red','Requiere revisión':'t-red','Cancelada':'t-red','IA activa':'t-teal','Escalada':'t-amber','Resuelta':'t-green','Activa':'t-green','Bloqueada':'t-gray','Activo':'t-green','Desactivado':'t-gray','Temporalmente no disponible':'t-amber','Generado':'t-gray','Finalizado':'t-green'};
  return `<span class="tag ${map[e]||'t-gray'}">${e}</span>`;
}
function beep(){
  const p=PANTALLAS.find(x=>x.sede===S.sede && x.sonido);
  if(!p) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [[880,0],[660,.28]].forEach(([f,d])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.18,ctx.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.25);
      o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+.3);
    });
  }catch(e){}
}

function login(role){
  S.role=role;
  document.body.dataset.role=role;
  $('#login').style.display='none';
  if(role==='kiosko'){ S.kiosk={step:'welcome',found:null,msg:null}; renderFS(V.kiosko); return; }
  if(role==='pantalla'){ renderFS(V.pantallaSala); startClock(); startMedia(); return; }
  if(role==='autoagenda'){ S.portal={step:'home'}; renderFS(V.autoagenda); return; }
  $('#app').style.display='block'; $('#fs').style.display='none';
  S.view = role==='prestador' ? 'prestadorView' : 'dashboard';
  render();
}
function logout(){
  S.role=null; document.body.dataset.role='';

  $('#app').style.display='none'; $('#fs').style.display='none'; $('#login').style.display='flex';
}

function render(){
  if(!S.role||['kiosko','pantalla','autoagenda'].includes(S.role)) return;
  const meta=ROLE_META[S.role];
  const nPend=pendientes();
  let sb=`<div class="brand"><div class="brand-mark">GP</div><div><h1>Grupo Provivir</h1></div></div>`;
  (NAV[S.role]||[]).forEach(([sec,items])=>{

      sb+=`<button class="nav-item ${S.view===id?'active':''}" onclick="nav('${id}')"><span class="ic">${ic}</span>${lb}${badge}</button>`;
    });
  });
  sb+=`<div class="foot"><button class="nav-item" onclick="logout()"><span class="ic">🚪</span>Cerrar sesión</button></div>`;

/* ===== Agenda consolidada (día / semana / mes) ===== */
V.consolidada = () => {
  const q=(S.consQ||'').toLowerCase();
  const psAll=PRESTADORES.filter(p=>p.sedes.includes(S.sede));
  const ps=psAll.filter(p=>S.consPres.includes(p.id));
  const head=`
  <div class="card" style="margin-bottom:1rem"><div class="bd searchbar">
    <div class="tabs">
      <button class="${S.consTab==='dia'?'active':''}" onclick="S.consTab='dia';render()">Día</button>
      <button class="${S.consTab==='semana'?'active':''}" onclick="S.consTab='semana';render()">Semana</button>
      <button class="${S.consTab==='mes'?'active':''}" onclick="S.consTab='mes';render()">Mes</button>
    </div>
    <input style="flex:1;min-width:220px" placeholder="🔎 Código, nombre o documento…" value="${esc(S.consQ||'')}" oninput="S.consQ=this.value;render()">
    <button class="btn btn-primary btn-sm" onclick="crearCitaManual(null,null,null)">➕ Crear cita</button>
  </div>
  <div class="bd searchbar" style="border-top:1px solid var(--line)">
    <span class="small muted">Prestadores:</span>
    ${psAll.map(p=>`<button class="btn btn-sm ${S.consPres.includes(p.id)?'btn-primary':'btn-ghost'}" onclick="consTogglePres('${p.id}')">${p.nombre.split(' ').slice(-1)[0]}</button>`).join('')}
  </div></div>`;

  if(S.consTab==='dia'){
    const horas=['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00'];
    const match=c=>{ if(!q) return true; const p=pac(c.pacId); return c.cod.toLowerCase().includes(q)||p.doc.includes(q)||(p.nombres+' '+p.apellidos).toLowerCase().includes(q); };
    const cell=(p,h)=>{
      const c=CITAS.find(x=>x.presId===p.id && x.hora>=h && x.hora<addMin(h,30) && match(x));
      if(c) return `<div class="slot busy ${c.tipo==='Control'?'ctrl':''} ${['Procedimiento','Examen'].includes(c.tipo)?'proc':''}" onclick="verCita(${c.id})"><span class="cd">${c.cod}</span> · ${pacName(c.pacId).split(' ')[0]}<br><span class="small muted">${c.hora} · ${c.tipo}</span></div>`;
      const a=AGENDAS.find(x=>x.presId===p.id && x.estado!=='Eliminada');
      if(!a || h<a.ini || h>=a.fin) return `<div class="slot blocked">—</div>`;
      if(a.estado==='Bloqueada') return `<div class="slot blocked">Bloqueado</div>`;
      return `<div class="slot free" title="Crear cita" onclick="crearCitaManual('${p.id}','${h}',null)"></div>`;
    };
    return head+`
    <div class="card"><div class="hd"><h3>Hoy · ${hoyLargo()}</h3><div class="spacer"></div>
      <span class="legend"><span><span class="dot" style="background:var(--teal)"></span>Consulta</span><span><span class="dot" style="background:var(--amber)"></span>Control</span><span><span class="dot" style="background:var(--blue)"></span>Procedimiento/Examen</span><span><span class="dot" style="background:#fff;border:1px dashed var(--line)"></span>Disponible</span></span></div>
    <div class="bd" style="overflow-x:auto">
      <div class="sched" style="--cols:${ps.length};min-width:${120+ps.length*160}px">
        <div></div>${ps.map(p=>`<div class="hcell">${p.nombre}<br><span class="small muted">${p.esp}</span></div>`).join('')}
        ${horas.map(h=>`<div class="tcell">${h}</div>${ps.map(p=>cell(p,h)).join('')}`).join('')}
      </div>
    </div></div>`;
  }
  if(S.consTab==='semana'){
    const dias=['Lun 17','Mar 18','Mié 19','Jue 20','Vie 21','Sáb 22'];
    const base={ao:[9,11,10,8,12,6], pr:[8,10,9,9,11,5], jo:[7,9,8,10,9,4], md:[12,12,11,12,12,8], lp:[0,0,0,6,0,0], is:[0,0,0,0,8,0], ec:[10,9,11,10,9,7], ln:[18,16,17,15,19,9]};
    return head+`
    <div class="card"><div class="hd"><h3>Semana del 17 al 22 de agosto</h3><div class="spacer"></div><span class="small muted">Clic en una celda para crear una cita futura</span></div>
    <table><thead><tr><th>Prestador</th>${dias.map(d=>`<th class="center">${d}</th>`).join('')}</tr></thead><tbody>
    ${ps.map(p=>`<tr><td><b>${p.nombre}</b><br><span class="small muted">${p.esp}</span></td>
      ${dias.map((d,i)=>{const n=(base[p.id]||[0,0,0,0,0,0])[i];return `<td class="center clickable" onclick="crearCitaManual('${p.id}',null,'2026-08-${17+i}')">${n?`<span class="tag ${n>10?'t-amber':'t-teal'}">${n} citas</span>`:'<span class="small muted">—</span>'}</td>`;}).join('')}
    </tr>`).join('')}
    </tbody></table></div>`;
  }
  /* Mes */
  const cnt=d=>({19:CITAS.length, 20:14, 21:22, 22:18, 25:11, 26:9, 27:15, 28:17}[d]||(d<19?Math.round(8+(d*7)%9):0));
  return head+`
  <div class="card"><div class="hd"><h3>Agosto 2026</h3><div class="spacer"></div><span class="small muted">Clic en un día para crear una cita futura</span></div>
  <div class="bd"><div class="mes">
    ${['L','M','X','J','V','S','D'].map(d=>`<div class="dh">${d}</div>`).join('')}
    ${'<div class="d off"></div><div class="d off"></div><div class="d off"></div><div class="d off"></div><div class="d off"></div>'}
    ${[...Array(31)].map((_,i)=>{const d=i+1;const n=cnt(d);
      return `<div class="d ${d===19?'sel':''}" onclick="crearCitaManual(null,null,'2026-08-${String(d).padStart(2,'0')}')"><span class="dn">${d}</span>${n?`<span class="cnt">${n} citas</span>`:''}</div>`;}).join('')}
  </div></div></div>`;
};

function guardarCitaManual(){
  const p=pres($('#cm-pres').value), sv=serv($('#cm-serv').value);
  const hora=$('#cm-hora').value, fecha=$('#cm-fecha').value;
  /* RN-01: no dos controles consecutivos */
  if(sv.tipo==='control'){
    const delDia=CITAS.filter(c=>c.presId===p.id && c.estado!=='Cancelada').sort((a,b)=>a.hora.localeCompare(b.hora));
    const prevC=[...delDia].reverse().find(c=>c.hora<=hora), nextC=delDia.find(c=>c.hora>hora);
    if((prevC&&prevC.tipo==='Control')||(nextC&&nextC.tipo==='Control')){
      toast('⛔ <b>Regla de intercalado (RN-01):</b> no se permiten dos citas de control consecutivas. La plataforma sugiere el siguiente cupo válido entre consultas generales.');
      return;
    }
  }
  const tipo=sv.tipo==='control'?'Control':sv.tipo==='procedimiento'?'Procedimiento':sv.tipo==='examen'?'Examen':'General';
  const cod=nuevoCodigo(sv.nombre[0].toUpperCase());
  CITAS.push({id:Date.now(), cod, pacId:+$('#cm-pac').value, presId:p.id, servId:sv.id, tipo, sede:S.sede, hora, dur:p.dur[sv.id]||sv.dur, estado:'Confirmada', origen:'Asistente', prio:2, obs:fecha!=='2026-08-19'?'Cita futura · '+fecha:''});
  audit(ROLE_META[S.role].nombre,'Creación de cita','Cita '+cod,`${sv.nombre} · ${fecha} ${hora}`,'—','Confirmada');
  toast(`✅ Cita creada · código <b>${cod}</b> · confirmación de WhatsApp enviada como texto formateado`); closeModal(); render();
}

function registrarLlegada(citaId, via){
  const c=CITAS.find(x=>x.id===citaId);
  if(TURNOS.some(t=>t.citaId===c.id)) { toast('ℹ️ Este paciente ya tiene llegada registrada'); return null; }
  const p=pac(c.pacId);
  const prio = p.cond.length ? 1 : c.prio||2;
  const prev=c.estado; c.estado='Llegó'; c.llegada=nowHM();
  const t={id:Date.now(), citaId:c.id, cod:c.cod, sede:c.sede, llegada:c.llegada, estado:'En espera', prio, consultorio:pres(c.presId).consultorio};
  TURNOS.push(t);
  S.live[via==='kiosko'?'kiosko':'mostrador']++;
  audit(via==='kiosko'?'kiosko':ROLE_META[S.role]?.nombre||'mostrador','Registro de llegada','Cita '+c.cod, (via==='kiosko'?'Check-in por kiosko (referencia)':'Registro en mostrador · pago en recepción')+(prio===1?' · prioridad preferencial':''), prev, 'Llegó');
  return t;
}

      <td>${tipoTag(c.tipo)}</td>

      <td>${prioTag}</td><td>${estadoTag(c.estado)}</td>

function kioskBuscar(){
  const v=($('#k-in').value||'').trim().toUpperCase();
  if(!v){ return; }
  const c=CITAS.find(x=>x.sede===S.sede && !['Atendida','Cancelada','No asistió'].includes(x.estado) &&
        (x.cod===v || pac(x.pacId).doc===v));
  if(!c){
    S.kiosk.msg='No encontramos una cita activa para hoy con los datos ingresados.<br><b>Por favor acércate al mostrador.</b>'; S.kiosk.msgType='err';
  } else if(c.estado==='Requiere revisión' || c.prio===4){
    S.kiosk.msg='Tu cita requiere revisión por el personal de atención.<br><b>Por favor acércate al mostrador.</b>'; S.kiosk.msgType='warn';
  } else if(TURNOS.some(t=>t.citaId===c.id)){
    S.kiosk={step:'done', found:c}; renderFS(V.kiosko); return;
  } else {
    S.kiosk={step:'confirm', found:c}; renderFS(V.kiosko); return;
  }
  renderFS(V.kiosko);
}
function kioskConfirmar(){
  registrarLlegada(S.kiosk.found.id,'kiosko');
  S.kiosk.step='done'; renderFS(V.kiosko);
}

        <button class="btn btn-dark" onclick="finalizarAtencion('${pid}')" ${actual&&actual.estado==='En atención'?'':'disabled'}>■ Finalizar</button>
        <button class="btn btn-amber" onclick="noRespondio('${pid}')" ${actual&&actual.estado==='Llamado'?'':'disabled'}>🔇 No respondió</button>
        <button class="btn btn-danger" onclick="noAsistio('${pid}')" ${actual?'':'disabled'}>✕ No asistió</button>
      </div>
      <div class="bd small muted" style="border-top:1px solid var(--line)">La cola prioriza atención preferencial (P1) y luego orden de llegada. El llamado aparece en la pantalla de sala.</div></div>
    </div>
  </div>`;
};
function priorizarPaciente(citaId){
  const c=CITAS.find(x=>x.id===citaId);
  openModal('Cambiar prioridad · '+pacName(c.pacId),`
    <div class="ia-panel" style="margin-bottom:1rem">
      <div class="row"><span class="muted">Código</span><span class="code-chip">${c.cod}</span></div>
      <div class="row"><span class="muted">Servicio</span><b>${serv(c.servId).nombre}</b></div>
      <div class="row"><span class="muted">Prioridad actual</span><b>${c.prio===1?'Preferencial':'Normal'}</b></div>
    </div>
    <div class="field"><label>Nueva prioridad</label><select id="pz-prio"><option value="1" ${c.prio===1?'selected':''}>Preferencial (pasa al frente de la cola)</option><option value="2" ${c.prio!==1?'selected':''}>Normal</option></select></div>
    <div class="field"><label>Nota del motivo (obligatoria)</label><textarea id="pz-nota" rows="3" placeholder="Ej.: paciente con dolor agudo / adulto mayor descompensado / solicitud de la administración…"></textarea></div>
    <button class="btn btn-primary btn-block" onclick="guardarPriorizacion(${c.id})">Guardar y reordenar la cola</button>
    <p class="small muted" style="margin-top:.6rem">El cambio queda registrado en auditoría con tu nombre, el motivo y la hora (RN-07.4).</p>`);
}
function guardarPriorizacion(citaId){
  const nota=($('#pz-nota').value||'').trim();
  if(!nota){ toast('⚠️ La nota del motivo es <b>obligatoria</b> para cambiar la prioridad'); return; }
  const c=CITAS.find(x=>x.id===citaId);
  const nueva=+$('#pz-prio').value;
  const prev=c.prio===1?'Preferencial':'Normal';
  c.prio=nueva;
  const t=TURNOS.find(x=>x.citaId===c.id); if(t){ t.prio=nueva; t.notaPriorizacion=nota; }
  audit(ROLE_META[S.role].nombre,'Priorización manual','Cita '+c.cod,'Nota: '+nota,prev,nueva===1?'Preferencial':'Normal');
  toast(`✅ Prioridad de <b>${c.cod}</b> actualizada · la cola se reordenó`);
  closeModal(); render();
}
function esperaDe(t){
  const [h,m]=t.llegada.split(':').map(Number);
  const mins=Math.max(0,Math.round((Date.now()-new Date().setHours(h,m,0,0))/60000));
  return mins+' min';
}
function turnoActual(pid){
  const ids=CITAS.filter(c=>c.presId===pid&&c.sede===S.sede).map(c=>c.id);
  return TURNOS.find(t=>ids.includes(t.citaId)&&['Llamado','En atención'].includes(t.estado));
}
function llamarSiguiente(pid){
  if(turnoActual(pid)){ toast('ℹ️ Finaliza o marca el turno actual antes de llamar otro'); return; }
  const ids=CITAS.filter(c=>c.presId===pid&&c.sede===S.sede).map(c=>c.id);
  const cola=TURNOS.filter(t=>ids.includes(t.citaId)&&t.estado==='En espera').sort((a,b)=>a.prio-b.prio||a.llegada.localeCompare(b.llegada));
  const t=cola[0];
  if(!t){ toast('ℹ️ No hay pacientes en espera'); return; }
  t.estado='Llamado'; t.llamadoEn=nowHM();
  const c=CITAS.find(x=>x.id===t.citaId); c.estado='Llamado';
  S.llamados.unshift({cod:t.cod, dest:t.consultorio, svc:serv(c.servId).nombre.split('·')[0].trim(), svcId:c.servId, sede:S.sede, ts:nowHM()});
  S.flash=true; beep();
  audit(pres(pid).nombre,'Llamado de turno','Turno '+t.cod,`Pantalla de sala: ${t.cod} → ${t.consultorio}`,'En espera','Llamado');
  toast(`📢 Turno <b>${t.cod}</b> → ${t.consultorio} · visible en pantalla de sala`);
  render();
}
function repetirLlamado(pid){
  const t=turnoActual(pid); if(!t) return;
  S.flash=true; beep();
  audit(pres(pid).nombre,'Llamado repetido','Turno '+t.cod,'Segundo llamado en pantalla','Llamado','Llamado');
  toast(`🔁 Llamado repetido: <b>${t.cod}</b>`);
}
function iniciarAtencion(pid){
  const t=turnoActual(pid); if(!t||t.estado!=='Llamado') return;
  t.estado='En atención'; t.iniciadoEn=nowHM();
  CITAS.find(x=>x.id===t.citaId).estado='En atención';
  audit(pres(pid).nombre,'Inicio de atención','Turno '+t.cod,'Paciente en consultorio','Llamado','En atención');
  render();
}
function finalizarAtencion(pid){
  const t=turnoActual(pid); if(!t||t.estado!=='En atención') return;
  t.estado='Finalizado'; t.finalizadoEn=nowHM(); S.live.atendidos++;
  CITAS.find(x=>x.id===t.citaId).estado='Atendida';
  audit(pres(pid).nombre,'Fin de atención','Turno '+t.cod,'Atención completada','En atención','Atendida');
  toast(`✅ Atención de <b>${t.cod}</b> finalizada · métricas actualizadas`);
  render();
}
function noRespondio(pid){
  const t=turnoActual(pid); if(!t) return;
  t.estado='No respondió'; CITAS.find(x=>x.id===t.citaId).estado='No respondió';
  audit(pres(pid).nombre,'Turno no respondido','Turno '+t.cod,'Paciente no se presentó al llamado','Llamado','No respondió');
  toast(`🔇 <b>${t.cod}</b> marcado como no respondió`); render();
}
function noAsistio(pid){
  const t=turnoActual(pid); if(!t) return;
  t.estado='Cancelado'; CITAS.find(x=>x.id===t.citaId).estado='No asistió';
  audit(pres(pid).nombre,'No asistió','Turno '+t.cod,'Cierre por inasistencia','Llamado','No asistió');
  toast(`✕ <b>${t.cod}</b> marcado como no asistió`); render();
}
