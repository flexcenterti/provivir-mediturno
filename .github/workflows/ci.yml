name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  verificar:
    name: Lint · Test · Build · Migraciones
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provivir
          POSTGRES_PASSWORD: provivir
          POSTGRES_DB: provivir
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provivir -d provivir"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://provivir:provivir@localhost:5432/provivir?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: secreto-solo-para-ci-no-usar-en-ningun-ambiente-real-000
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Checklist §4.8 · sin vulnerabilidades altas ni críticas
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      # Checklist §4.3 · ningún secreto en el repo ni en el historial
      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

      # El cliente de Prisma lo genera el postinstall de @provivir/api. Esto verifica
      # que el hook siga funcionando: sin él, `npm ci` deja el proyecto sin compilar.
      - name: Verificar que el postinstall generó el cliente Prisma
        run: test -d node_modules/.prisma/client

      # Las migraciones deben aplicar limpias sobre una base vacía
      - name: Migraciones
        run: npm run db:deploy -w @provivir/api

      - name: Seed
        run: npm run db:seed -w @provivir/api

      - name: Pruebas unitarias
        run: npm test --workspaces --if-present

      - name: Pruebas e2e
        run: npm run test:e2e -w @provivir/api

      - run: npm run build

  # Guía FASE 6 · endurecimiento. Corre aparte para no alargar el ciclo de cada PR.
  seguridad:
    name: Endurecimiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Auditoría de dependencias (alta y crítica)
        run: npm audit --audit-level=high

      - name: Escaneo de secretos en todo el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Falla si alguien reintroduce la palabra prohibida de cara al usuario (D6).
      - name: Terminología · "urgencia" prohibida
        run: |
          # Se excluyen las pruebas, que verifican precisamente la ausencia del término,
          # y las líneas marcadas D6-permitido (derivar al paciente FUERA de la clínica).
          if grep -rniE '\burgencia' apps/*/src packages/*/src \
               --include='*.ts' --include='*.tsx' --exclude='*.spec.ts' \
               | grep -viE '(D6-permitido|no presta|prohibid|nunca|jamás|D6|RN-05)'; then
            echo "Se encontró la palabra 'urgencia' fuera de un comentario explicativo (D6)."
            exit 1
          fi
          echo "Terminología correcta."

      # El motor es el único que decide reglas de agendamiento (ADR A3).
      - name: Reglas de negocio solo en el módulo citas
        run: |
          if grep -rn 'violaIntercalado\|elegirPorMenorCarga\|controlDentroDeVentana' \
               apps/api/src --include='*.ts' \
               | grep -v 'src/citas/' | grep -v '\.spec\.ts'; then
            echo "Hay lógica de agendamiento fuera del módulo citas (ADR A3)."
            exit 1
          fi
          echo "Reglas contenidas en el motor."
